name: Daily papers

on:
  schedule:
    # 13:00 UTC Mon–Fri (05:00/06:00 Pacific), after arXiv's nightly announcement
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-papers
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - name: Fetch and rank papers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_papers.py
      - name: Commit digest
        run: |
          git config user.name "paper-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/data
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "papers: digest $(date -u +%F)"
          git push
