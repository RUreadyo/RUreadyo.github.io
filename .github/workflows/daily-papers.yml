name: Daily papers

on:
  schedule:
    # 13:00 UTC Mon–Fri (05:00/06:00 Pacific), after arXiv's nightly announcement
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-papers
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - name: Fetch and rank papers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_papers.py
      - name: Refresh 10-year impact list (weekly)
        continue-on-error: true
        run: |
          python - <<'PY' && python scripts/impact.py || true
          import json, datetime, sys
          try:
              d = json.load(open("papers/data/impact.json"))["updated"]
              sys.exit(0 if (datetime.date.today() - datetime.date.fromisoformat(d)).days > 7 else 1)
          except FileNotFoundError:
              sys.exit(0)
          PY
      - name: Update trending-ML monthly archive
        continue-on-error: true
        run: timeout 300 python scripts/trending_archive.py || true
      - name: Update conference archive (new proceedings only; weekly)
        continue-on-error: true
        run: |
          [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || exit 0
          timeout 1500 python scripts/conferences.py || true
      - name: Commit digest
        run: |
          git config user.name "paper-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/data
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "papers: digest $(date -u +%F)"
          git pull --rebase && git push
